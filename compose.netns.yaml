# NERD_NETWORK=container:<name>: the containers join that container's
# network namespace (e.g. a VPN sidecar) instead of <name>-net; nothing is
# published, the server (or the key proxy) listens on loopback only (NERD_SERVER_HOST).
services:
  llm:
    network_mode: ${NERD_NETWORK:?}
    networks: !reset []
  keyproxy:
    network_mode: ${NERD_NETWORK:?}
    networks: !reset []
  agent:
    network_mode: ${NERD_NETWORK:?}
    networks: !reset []
    ports: !reset []
