# tmux of the `tui` mode (Pi runs in session "nerd").
set -g history-limit 50000
set -g mouse on
set -g default-terminal "tmux-256color"
# Size of the window before anyone attaches, then whoever attached last.
set -g default-size 160x45
setw -g window-size latest
# Pi tells Shift+Enter (new line) from Enter (send) only with extended keys;
# tmux 3.2-3.4 know only the xterm modifyOtherKeys form (Pi's docs, tmux.md).
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g status-right " nerd  %H:%M"
